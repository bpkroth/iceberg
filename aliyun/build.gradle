test {
 useJUnitPlatform()
}
dependencies {
  implementation project(path: ':bundled-guava', configuration: 'shadow')
  api project(':api')
  implementation project(':core')
  implementation project(':common')

  compileOnly libs.aliyun.sdk.oss
  compileOnly libs.jaxb.api
  compileOnly libs.activation
  compileOnly libs.jaxb.runtime
  compileOnly(libs.hadoop3.common) {
    exclude group: 'org.apache.avro', module: 'avro'
    exclude group: 'org.slf4j', module: 'slf4j-log4j12'
    exclude group: 'javax.servlet', module: 'servlet-api'
    exclude group: 'com.google.code.gson', module: 'gson'
  }

  testImplementation platform(libs.jackson.bom)
  testImplementation "com.fasterxml.jackson.dataformat:jackson-dataformat-xml"
  testImplementation project(path: ':api', configuration: 'testArtifacts')
}
