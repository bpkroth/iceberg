test {
  useJUnitPlatform()
}

dependencies {
  api project(':api')
  implementation project(':common')
  implementation project(':core')

  implementation project(path: ':bundled-guava', configuration: 'shadow')

  implementation platform(libs.google.libraries.bom)
  compileOnly "com.google.cloud:google-cloud-storage"
  implementation "com.google.cloud:google-cloud-bigquery"
  implementation "com.google.cloud:google-cloud-core"

  testImplementation project(path: ':core', configuration: 'testArtifacts')
  testImplementation project(path: ':api', configuration: 'testArtifacts')

  testImplementation(libs.hadoop3.common) {
    exclude group: 'org.apache.avro', module: 'avro'
    exclude group: 'org.slf4j', module: 'slf4j-log4j12'
    exclude group: 'javax.servlet', module: 'servlet-api'
    exclude group: 'com.google.code.gson', module: 'gson'
  }
}
